<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — QuickPOS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{DEFAULT:'#10b981',50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b'}},fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['ui-monospace','SFMono-Regular','monospace']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
  <script>(function(){const t=localStorage.getItem('quickpos-theme')||'light';if(t==='dark')document.documentElement.classList.add('dark')})();</script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-primary-500 to-emerald-600 text-white shadow-lg mb-4"><i data-lucide="store" class="w-7 h-7"></i></div>
      <h1 class="text-2xl font-bold">QuickPOS</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="flex items-center gap-2 px-4 py-3 rounded-lg mb-4 text-sm font-medium
          {% if category == 'error' %}bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300
          {% elif category == 'success' %}bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300
          {% else %}bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-300{% endif %}">
          <i data-lucide="{% if category == 'error' %}alert-circle{% elif category == 'success' %}check-circle{% else %}info{% endif %}" class="w-4 h-4 shrink-0"></i>
          <span>{{ message }}</span>
        </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-6 space-y-4 shadow-sm">
      <div>
        <label class="text-xs font-medium block mb-1.5">Email</label>
        <input type="email" name="email" required autofocus placeholder="you@example.com"
          class="w-full h-10 rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 text-sm focus:border-primary-500 focus:outline-none" />
      </div>
      <div>
        <label class="text-xs font-medium block mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full h-10 rounded-md border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 text-sm focus:border-primary-500 focus:outline-none" />
      </div>
      <button type="submit" class="w-full h-10 rounded-md bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold flex items-center justify-center gap-1.5 transition-colors">
        <i data-lucide="log-in" class="w-4 h-4"></i> Sign In
      </button>
      <div class="flex items-center justify-between text-xs">
        <a href="/forgot" class="text-primary-500 hover:underline">Forgot password?</a>
        <a href="/register" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Create account</a>
      </div>
    </form>
    <p class="text-center text-[11px] text-gray-400 mt-6">QuickPOS &mdash; Point of Sale System</p>
  </div>
  <script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
